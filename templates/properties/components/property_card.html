<div class="bg-white rounded-xl shadow-sm hover:shadow-lg transition overflow-hidden">

{% with image=property.images.first %}


{% if image %}


<img

src="{{ image.image.url }}"

alt="{{ property.title }}"

class="w-full h-56 object-cover"

>


{% else %}


<div class="w-full h-56 bg-gray-200 flex items-center justify-center">

<span class="text-gray-500">

No image

</span>


</div>


{% endif %}


{% endwith %}



<div class="p-5">


<h2 class="text-xl font-semibold">

{{ property.title }}

</h2>



<p class="text-gray-500 mt-2">

📍 {{ property.location.name }}

</p>




<div class="mt-3 text-sm text-gray-600">

{{ property.bedrooms }} Beds

<span class="mx-2">
•
</span>

{{ property.bathrooms }} Baths

<span class="mx-2">
•
</span>

{{ property.area_sqft }} sqft


</div>




<p class="text-lg font-bold text-blue-600 mt-4">

৳ {{ property.price }}

</p>




<a

href="{% url 'property_detail' property.slug %}"

class="inline-block mt-4 text-blue-600 font-medium"

>

View Details →

</a>


</div>


</div>
