{% extends "base.html" %}


{% block title %}
Find Properties
{% endblock %}



{% block content %}


<section class="max-w-4xl mx-auto text-center py-12">


<h1 class="text-4xl font-bold mb-4">
    Find Your Perfect Property
</h1>


<p class="text-gray-600 mb-8">
    Search homes, apartments and villas by location.
</p>




<form 
method="GET"
action="/properties/"
class="bg-white shadow-lg rounded-xl p-6"
>


<div class="flex gap-3">

<div class="relative flex-1">

    <input
        id="location-search"
        type="text"
        name="location"
        autocomplete="off"
        placeholder="Search location e.g. Gulshan"
        class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-400"
    >

    <div
        id="suggestions"
        class="absolute z-10 bg-white border rounded-lg shadow-lg w-full hidden"
    >
    </div>

</div>


<button

class="bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700"

>

Search

</button>


</div>


</form>


</section>


{% endblock %}
