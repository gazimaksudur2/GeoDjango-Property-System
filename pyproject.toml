[project]
name = "geodjango-property-system"
version = "0.1.0"
description = "GeoDjango Property Management System"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "django==4.2.11",
    "django-leaflet>=0.34.0",
    "psycopg2-binary>=2.9.13",
    "pgvector>=0.3.6",
    "pillow>=12.3.0",
    "djangorestframework>=3.17.2",
    "pandas>=3.0.6",
    "django-filter>=25.1",
    "sentence-transformers>=6.1.0",
    "torch",
    "transformers>=5.19.0",
    "torchvision>=0.29.1",
]

[tool.uv]
package = false


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
